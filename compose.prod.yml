services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    expose:
      - "8000"
    volumes:
      - ./:/ascii-art
      - /ascii-art/.venv
    env_file:
      - .env
    restart: always
    tty: true
    container_name: ascii-art
    networks:
      - proxy_network
      - default

networks:
  proxy_network:
    external: true
